<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe - Matrix Enhanced</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Matrix Background Canvas -->
    <canvas id="matrix-canvas"></canvas>

    <div class="content-wrapper"> <!-- Wrapper to keep game content above canvas -->
        <h1>Tic Tac Toe</h1>

        <div class="difficulty-selector">
            <button id="easy" class="difficulty-btn">Easy</button>
            <button id="medium" class="difficulty-btn active">Medium</button>
            <button id="hard" class="difficulty-btn">Hard</button>
        </div>

        <div class="game-board">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div id="game-status" class="game-status">
            <span id="status-message"></span>
            <span id="trophy" style="display: none;">🏆</span>
        </div>

        <button id="reset-button" class="reset-button" style="display: none;">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="feather feather-rotate-cw"><polyline points="23 4 23 10 17 10"></polyline><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"></path></svg>
        </button>

         <!-- Updated placement for Creator Info within the wrapper but positioned fixed -->
         <div id="creator-info">
            Created By:- Surya_Dabwal
        </div>

    </div> <!-- End Content Wrapper -->

    <script src="script.js"></script>
</body>
</html>
